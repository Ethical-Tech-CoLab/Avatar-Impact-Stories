name: Deploy demo to GitHub Pages

# GitHub Pages cannot serve Git LFS files directly — point Pages at a branch and
# every tile renders as a broken image, because Pages serves the ~130-byte
# pointer file rather than the media.
#
# actions/checkout with lfs:true resolves LFS at build time, so the artifact
# uploaded to Pages contains real bytes. After compression the whole media set
# is ~436 MB, which fits inside the 1 GB Pages limit, so the site is entirely
# self-contained: no release assets, no external CDN, no separate manifest.
#
# If the media ever outgrows the limit again, tools/publish_web.py moves the
# MP4s to release assets and writes stories.web.json; see the README.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - stories.json
      - stories.web.json
      - final_gifs/**
      - Crowd.png
      - background.*
      - background testing.mp3
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with LFS media
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS objects
        run: git lfs pull

      - name: Assemble the site
        run: |
          set -euo pipefail

          mkdir -p _site/final_gifs
          cp index.html sw.js _site/
          cp Crowd.png "background testing.mp3" _site/
          # Whatever drop-in background is in use, if any.
          for f in background.png background.jpg background.jpeg background.webp \
                   background.mp3 background.m4a background.ogg background.wav; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          cp final_gifs/*.gif _site/final_gifs/

          if [ -f stories.web.json ]; then
            echo "Using stories.web.json (media hosted off-site)."
            cp stories.web.json _site/stories.json
          else
            echo "Publishing media with the site."
            cp final_gifs/*.mp4 _site/final_gifs/
            cp stories.json _site/stories.json
          fi

          # Pages would otherwise run the whole thing through Jekyll and drop
          # files it does not recognise.
          touch _site/.nojekyll

          echo "Site contents:"
          du -sh _site
          find _site -maxdepth 1 -printf '  %f\n'

      - name: Fail if any media is still an LFS pointer
        run: |
          set -euo pipefail
          bad=0
          # Real GIFs start "GIF89a"; LFS pointers start "version".
          for f in _site/final_gifs/* _site/Crowd.png "_site/background testing.mp3"; do
            [ -f "$f" ] || continue
            if [ "$(head -c 7 "$f")" = "version" ]; then
              echo "::error::$f is still a Git LFS pointer, not real media."
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "All media resolved to real files."

      - name: Check every story in the manifest actually shipped
        run: python3 .github/scripts/check_site.py

      - name: Check the artifact fits the Pages limit
        run: |
          bytes=$(du -sb _site | cut -f1)
          echo "Artifact is $((bytes / 1000000)) MB."
          if [ "$bytes" -gt 1000000000 ]; then
            echo "::error::Artifact exceeds the 1 GB GitHub Pages limit. Move the videos off-site with tools/publish_web.py."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
