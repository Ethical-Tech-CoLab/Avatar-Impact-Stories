<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Many Voices &middot; Avatar Impact Stories</title>
<style>
    :root {
        --tile-w: 100px;
        --tile-h: 178px;
        --ease: cubic-bezier(.2, .8, .2, 1);
        --open-ms: 550ms;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
        background: #000;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #fff;
        overflow: hidden;
    }

    /* ---------- the wall ---------- */

    #stage {
        position: fixed;
        inset: 0;
        background: #000 center / cover no-repeat;
    }

    .phone-tile {
        position: absolute;
        width: var(--tile-w);
        height: var(--tile-h);
        padding: 4px;
        border-radius: 12px;
        background: #1a1a1a;
        box-shadow: 0 0 10px rgba(0, 0, 0, .5);
        overflow: hidden;
        cursor: pointer;
        transform-origin: center;
        /* Only opacity animates here. Position is set directly so a resize
           does not send every tile gliding across the screen. */
        transition: opacity 240ms linear;
    }

    .phone-tile::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 50%;
        transform: translateX(-50%);
        width: 40%;
        height: 2px;
        background: #2a2a2a;
        border-radius: 3px;
        z-index: 2;
    }

    /* display:contents keeps the <picture> wrapper out of the layout entirely,
       so the img still sizes against the tile exactly as it did before. */
    .phone-tile picture { display: contents; }

    .phone-tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
        display: block;
    }

    /* The tile whose story is currently on screen is hidden so the enlarged
       player appears to *be* that phone rather than float above a copy. */
    .phone-tile.is-source { opacity: 0; }

    /* ---------- the player ---------- */

    #overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, .82);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--open-ms) var(--ease);
    }

    #overlay.is-open {
        opacity: 1;
        pointer-events: auto;
    }

    /* Sized in real pixels rather than scaled up from a 100px tile, so the
       video plays at its native resolution instead of being upscaled. */
    #player-frame {
        position: relative;
        height: min(80vh, calc(90vw * 178 / 100));
        aspect-ratio: 100 / 178;
        background: #1a1a1a;
        border-radius: 26px;
        padding: 6px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, .8);
        will-change: transform;
    }

    #player {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 20px;
        display: block;
        background: #000;
    }

    /* Shown only while the player is genuinely waiting on data, so a slow
       network reads as "loading" rather than "broken". */
    #overlay.is-buffering #player-frame::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, .25);
        border-top-color: rgba(255, 255, 255, .9);
        animation: spin 900ms linear infinite;
        pointer-events: none;
        z-index: 3;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
        #overlay.is-buffering #player-frame::after { animation: none; }
    }

    /* Disclosure watermark: the presenter is synthetic, and the viewer should
       never have to guess. Sits over the video, bottom-left, and is excluded
       from pointer events so it cannot block the dismiss-on-click backdrop. */
    #ai-badge {
        position: absolute;
        left: 3.5%;
        bottom: 3.5%;
        z-index: 2;
        padding: .3em .62em;
        border-radius: .4em;
        font-size: clamp(13px, 2.4vh, 22px);
        font-weight: 700;
        letter-spacing: .09em;
        line-height: 1;
        color: rgba(255, 255, 255, .92);
        background: rgba(255, 255, 255, .18);
        border: 1px solid rgba(255, 255, 255, .35);
        /* Keeps it legible over both a bright face and a dark background. */
        text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity .25s ease;
    }

    #overlay.is-open #ai-badge {
        opacity: 1;
    }

    #caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -2.4rem;
        text-align: center;
        font-size: .95rem;
        letter-spacing: .02em;
        color: rgba(255, 255, 255, .75);
        pointer-events: none;
    }

    #close {
        position: fixed;
        top: 24px;
        right: 24px;
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, .12);
        color: #fff;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        transition: background 160ms linear;
    }

    #close:hover { background: rgba(255, 255, 255, .24); }

    /* Provenance link. Anyone who has just watched a story will want to know
       how it was made, so the way there stays on screen while the wall is
       idle. It gets out of the way entirely once a story opens. */
    #about-link {
        position: fixed;
        right: 20px;
        bottom: 18px;
        z-index: 900;
        padding: .5rem .95rem;
        border-radius: 999px;
        background: rgba(0, 0, 0, .45);
        border: 1px solid rgba(255, 255, 255, .22);
        color: rgba(255, 255, 255, .82);
        font-size: .82rem;
        text-decoration: none;
        backdrop-filter: blur(4px);
        transition: opacity 240ms linear, background 160ms linear, color 160ms linear;
    }

    #about-link:hover {
        background: rgba(0, 0, 0, .7);
        color: #fff;
    }

    #overlay.is-open ~ #about-link {
        opacity: 0;
        pointer-events: none;
    }

    /* ---------- start / error screens ---------- */

    .screen {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
        background: radial-gradient(circle at 50% 40%, #16202e 0%, #05070b 70%);
    }

    .screen[hidden] { display: none; }

    .screen h1 {
        margin: 0 0 .5rem;
        font-size: clamp(1.9rem, 5vw, 3.2rem);
        font-weight: 600;
        letter-spacing: -.02em;
    }

    .screen p {
        margin: 0 auto 1.75rem;
        max-width: 46ch;
        line-height: 1.6;
        color: rgba(255, 255, 255, .68);
    }

    .screen code {
        background: rgba(255, 255, 255, .1);
        padding: .15em .45em;
        border-radius: 5px;
        font-size: .95em;
    }

    button.primary {
        font: inherit;
        font-size: 1.05rem;
        padding: .85rem 2.4rem;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #05070b;
        cursor: pointer;
        transition: transform 160ms var(--ease);
    }

    button.primary:hover { transform: translateY(-2px); }

    button.link, a.link {
        font: inherit;
        display: inline-block;
        margin-top: 1.25rem;
        background: none;
        border: 0;
        color: rgba(255, 255, 255, .55);
        text-decoration: underline;
        cursor: pointer;
    }

    a.link:hover { color: rgba(255, 255, 255, .85); }

    #error-detail {
        margin-top: 1rem;
        font-size: .85rem;
        color: rgba(255, 130, 130, .8);
        word-break: break-word;
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 1ms !important; }
    }
</style>
</head>
<body>

<div id="stage"><!-- tiles are injected here --></div>

<div id="overlay">
    <div id="player-frame">
        <video id="player" playsinline preload="metadata"></video>
        <!-- Disclosure: every presenter on this wall is AI-generated. It sits
             inside the frame so it scales and animates with the video. -->
        <div id="ai-badge" aria-label="This presenter is AI-generated">AI</div>
        <div id="caption"></div>
    </div>
</div>
<button id="close" hidden aria-label="Close story">&times;</button>
<a id="about-link" href="about.html">How this was made</a>

<audio id="ambience" loop preload="auto"></audio>

<section class="screen" id="start-screen">
    <div>
        <h1>Many Voices</h1>
        <p>
            A wall of stories inspired by the people who lived them. Tap any phone to
            hear one. These accounts describe trafficking, forced and child
            labour, and violence &mdash; please take care.
        </p>
        <button class="primary" id="start-button">Begin</button>
        <div><a class="link" href="about.html">How this was made</a></div>
    </div>
</section>

<!-- The folder picker lives here, not on the start screen: it is only ever
     offered when the manifest failed to load, and showError() hides the start
     screen. On the start screen it was unreachable. -->
<section class="screen" id="error-screen" hidden>
    <div>
        <h1>Can't load the stories</h1>
        <p id="error-message"></p>
        <button class="primary" id="retry-button">Try again</button>
        <div><button class="link" id="picker-button" hidden>Load stories from a folder instead</button></div>
        <div id="error-detail"></div>
    </div>
</section>

<script>
(function () {
    'use strict';

    var DEFAULTS = {
        rows: 0,          // 0 = derive the grid from the number of stories
        cols: 0,          // set both to force a fixed grid instead
        scatter: 0.16,   // max positional jitter, as a fraction of tile size
        gapRatio: 0.16,  // spacing between tiles, as a fraction of tile size
        tilt: 4,         // max rotation in degrees, +/-
        openDelayMs: 120, // pause after the zoom lands before playback starts
        // How many stories to pre-download into the browser cache while the
        // wall is idle. 0 turns it off. A permanently installed kiosk on a
        // wired network can raise this to the number of stories; on the web,
        // a few ahead is plenty and keeps playback the priority.
        warmAhead: 4
    };

    var TILE_ASPECT = 100 / 178;   // phone shape
    var MIN_TILE_H = 90;
    var MAX_TILE_H = 300;

    // If a video neither plays nor errors within this window we assume it is
    // wedged and recover, rather than leaving the kiosk stuck on one tile.
    var LOAD_TIMEOUT_MS = 20000;
    var OVERRUN_GRACE_MS = 8000;

    var stage = document.getElementById('stage');
    var overlay = document.getElementById('overlay');
    var frame = document.getElementById('player-frame');
    var player = document.getElementById('player');
    var caption = document.getElementById('caption');
    var closeButton = document.getElementById('close');
    var ambience = document.getElementById('ambience');
    var startScreen = document.getElementById('start-screen');
    var startButton = document.getElementById('start-button');
    var pickerButton = document.getElementById('picker-button');
    var errorScreen = document.getElementById('error-screen');
    var errorMessage = document.getElementById('error-message');
    var errorDetail = document.getElementById('error-detail');
    var retryButton = document.getElementById('retry-button');

    var config = Object.assign({}, DEFAULTS);
    var stories = [];
    var tiles = [];
    var objectUrls = [];      // only used by the folder-picker fallback
    var activeTile = null;
    var isBusy = false;       // true from the moment a tile is tapped until reset
    var session = 0;          // bumped on every open/close so stale async work can bail
    var watchdog = null;
    var openTimer = null;

    /* ------------------------------------------------------------------ *
     * Loading
     * ------------------------------------------------------------------ */

    async function loadManifest() {
        var response = await fetch('stories.json', { cache: 'no-cache' });
        if (!response.ok) {
            throw new Error('stories.json responded with ' + response.status);
        }
        var data = await response.json();

        if (data.grid) {
            ['rows', 'cols', 'scatter', 'gapRatio', 'tilt'].forEach(function (key) {
                if (typeof data.grid[key] === 'number' && data.grid[key] >= 0) {
                    config[key] = data.grid[key];
                }
            });
        }

        // Media does not have to sit next to the page. GitHub Pages cannot serve
        // Git LFS files, so a published build points mediaBase at wherever the
        // large media actually lives (release assets, a CDN, a storage bucket).
        var base = typeof data.mediaBase === 'string' ? data.mediaBase : '';
        if (base && base.slice(-1) !== '/') base += '/';

        function resolve(path) {
            if (!path) return path;
            // Already absolute (https://…, //…, /…): leave it alone.
            if (/^([a-z][a-z0-9+.-]*:)?\/\//i.test(path) || path.charAt(0) === '/') return path;
            return base + path;
        }

        if (data.background) {
            // Paths in the manifest are already URL-encoded; do not re-encode.
            if (data.background.image) {
                stage.style.backgroundImage = 'url("' + resolve(data.background.image) + '")';
            }
            if (data.background.audio) {
                ambience.src = resolve(data.background.audio);
            }
        }

        // A story is only usable if it has both a looping poster and a video to
        // play. Dropping the incomplete ones here is what stops a half-finished
        // export from freezing the wall later on.
        var usable = (data.stories || []).filter(function (story) {
            return story && story.poster && story.video;
        });
        var skipped = (data.stories || []).length - usable.length;
        if (skipped > 0) {
            console.warn('Skipped ' + skipped + ' story/stories with no paired video.');
        }
        if (usable.length === 0) {
            throw new Error('stories.json contains no story with both a poster and a video.');
        }

        return usable.map(function (story) {
            return {
                id: story.id,
                title: story.title,
                poster: resolve(story.poster),
                posterWebp: story.posterWebp ? resolve(story.posterWebp) : '',
                video: resolve(story.video)
            };
        });
    }

    /* ------------------------------------------------------------------ *
     * Offline media cache
     *
     * Streaming a 5-30 MB story over venue Wi-Fi stalls, and it always stalls
     * mid-testimony. sw.js keeps the media in the Cache API so a story plays
     * from local disk once it has been fetched. Caching happens through the
     * service worker rather than blob URLs on purpose: a blob per story would
     * pin tens of megabytes of JS heap and bring back the leak that used to
     * kill the kiosk after a few hours.
     * ------------------------------------------------------------------ */

    var swReady = null;

    function initMediaCache() {
        if (!('serviceWorker' in navigator)) return;
        // Requires a secure context; file:// and plain http (other than
        // localhost) simply fall back to normal streaming.
        if (!window.isSecureContext) return;

        swReady = navigator.serviceWorker.register('sw.js')
            .then(function () { return navigator.serviceWorker.ready; })
            .catch(function (err) {
                console.warn('Media cache unavailable; streaming directly.', err);
                return null;
            });
    }

    // Suspend background warming for as long as a story is on screen, so the
    // download queue can never compete with the story being watched.
    function notifyCache(type) {
        if (!swReady) return;
        swReady.then(function (registration) {
            if (registration && registration.active) {
                registration.active.postMessage({ type: type });
            }
        }).catch(function () {});
    }

    // Warm the cache while the wall is idle, in wall order, so the stories most
    // likely to be tapped first are the first to become instant.
    //
    // This is deliberately conservative. The full set of stories is several
    // hundred megabytes; pulling all of it down in the background is fine for a
    // kiosk on a wired venue network and actively harmful for someone on a
    // phone, where it competes with the story they are actually watching and
    // burns their data. So: only a few stories ahead by default, never on a
    // metered or slow connection, and never before the tiles themselves have
    // finished loading.
    function warmCache() {
        if (!swReady) return;
        if (!config.warmAhead) return;

        var link = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (link) {
            if (link.saveData) return;
            if (/(^|-)(2g|slow-2g)$/.test(link.effectiveType || '')) return;
        }

        swReady.then(function (registration) {
            if (!registration || !registration.active) return;
            var urls = tiles.map(function (tile) {
                return stories[Number(tile.dataset.storyIndex)].video;
            }).filter(function (href) {
                // Only same-origin media can be cached by our worker.
                return href && !/^([a-z][a-z0-9+.-]*:)?\/\//i.test(href);
            }).map(function (href) {
                return new URL(href, location.href).href;
            }).slice(0, config.warmAhead);
            if (urls.length) {
                registration.active.postMessage({ type: 'warm', urls: urls });
            }
        });
    }

    function showError(message, detail) {
        errorMessage.textContent = message;
        errorDetail.textContent = detail || '';
        startScreen.hidden = true;
        errorScreen.hidden = false;
    }

    /* ------------------------------------------------------------------ *
     * Layout
     * ------------------------------------------------------------------ */

    // Tile size is derived from the viewport rather than hard-coded, so the wall
    // fits any kiosk display instead of overlapping its own rows below 1080p.
    function measure() {
        var stageW = stage.clientWidth;
        var stageH = stage.clientHeight;
        var marginX = stageW * 0.04;
        var marginY = stageH * 0.04;
        var spanX = stageW - marginX * 2;
        var spanY = stageH - marginY * 2;
        var ratio = TILE_ASPECT;
        var gapRatio = config.gapRatio;

        var tileH = spanY / (config.rows + (config.rows - 1) * gapRatio);
        var tileW = tileH * ratio;

        // Refit against the width if the height-derived size is too wide.
        if (tileW * (config.cols + (config.cols - 1) * gapRatio) > spanX) {
            tileW = spanX / (config.cols + (config.cols - 1) * gapRatio);
            tileH = tileW / ratio;
        }

        tileH = Math.max(MIN_TILE_H, Math.min(tileH, MAX_TILE_H));
        tileW = tileH * ratio;

        var gapX = config.cols > 1 ? (spanX - tileW * config.cols) / (config.cols - 1) : 0;
        var gapY = config.rows > 1 ? (spanY - tileH * config.rows) / (config.rows - 1) : 0;

        return {
            tileW: tileW, tileH: tileH,
            marginX: marginX, marginY: marginY,
            gapX: gapX, gapY: gapY,
            // Never let the random scatter push a tile far enough to collide
            // with its neighbour, however tight the grid gets.
            jitterX: Math.min(tileW * config.scatter, Math.max(gapX, 0) * 0.45),
            jitterY: Math.min(tileH * config.scatter, Math.max(gapY, 0) * 0.45)
        };
    }

    // Each tile keeps the jitter and tilt it was born with, so relayout after a
    // resize or an orientation change is stable instead of reshuffling the wall.
    function placeTiles() {
        var m = measure();
        document.documentElement.style.setProperty('--tile-w', m.tileW.toFixed(2) + 'px');
        document.documentElement.style.setProperty('--tile-h', m.tileH.toFixed(2) + 'px');

        tiles.forEach(function (tile) {
            var row = Number(tile.dataset.row);
            var col = Number(tile.dataset.col);
            var rowCount = Number(tile.dataset.rowCount) || config.cols;
            // Centre a short final row rather than leaving it hanging left.
            var indent = (config.cols - rowCount) * (m.tileW + m.gapX) / 2;
            var x = m.marginX + indent + col * (m.tileW + m.gapX)
                + Number(tile.dataset.jitterX) * m.jitterX;
            var y = m.marginY + row * (m.tileH + m.gapY) + Number(tile.dataset.jitterY) * m.jitterY;
            tile.style.left = Math.round(x) + 'px';
            tile.style.top = Math.round(y) + 'px';
            tile.style.transform = 'rotate(' + tile.dataset.tilt + 'deg)';
        });
    }

    // The wall must never show the same person twice — repeating a face is the
    // one thing that undercuts a piece called "Many Voices". So the grid is
    // derived from how many stories exist rather than being fixed at 5x6, and
    // exactly one tile is created per story.
    //
    // Picks the rows/cols split whose overall shape best matches the display,
    // preferring layouts that leave few empty seats in the final row.
    function computeGrid(count) {
        if (config.rows > 0 && config.cols > 0) {
            return { rows: config.rows, cols: config.cols, explicit: true };
        }
        var stageAspect = (stage.clientWidth || 1920) / (stage.clientHeight || 1080);
        var best = null;
        for (var cols = 1; cols <= count; cols++) {
            var rows = Math.ceil(count / cols);
            var wallAspect = (cols * TILE_ASPECT) / rows;
            // How far the wall's shape is from the screen's shape.
            var shapeCost = Math.abs(Math.log(wallAspect / stageAspect));
            // How many seats in the last row would sit empty.
            var gapCost = (rows * cols - count) * 0.06;
            var cost = shapeCost + gapCost;
            if (!best || cost < best.cost) {
                best = { rows: rows, cols: cols, cost: cost };
            }
        }
        return best;
    }

    function shuffled(length) {
        var order = [];
        for (var i = 0; i < length; i++) order.push(i);
        for (var j = order.length - 1; j > 0; j--) {
            var k = Math.floor(Math.random() * (j + 1));
            var swap = order[j];
            order[j] = order[k];
            order[k] = swap;
        }
        return order;
    }

    function buildWall() {
        stage.textContent = '';
        tiles = [];

        var grid = computeGrid(stories.length);
        config.rows = grid.rows;
        config.cols = grid.cols;

        // One seat per story, never more: seats beyond the story count are left
        // empty rather than filled with a repeat.
        var seats = grid.explicit
            ? Math.min(grid.rows * grid.cols, stories.length)
            : stories.length;
        var order = shuffled(stories.length).slice(0, seats);

        for (var seat = 0; seat < order.length; seat++) {
            var row = Math.floor(seat / grid.cols);
            var col = seat % grid.cols;
            var index = order[seat];
            var story = stories[index];

            // A short final row is centred so the wall does not look truncated.
            var inThisRow = Math.min(grid.cols, order.length - row * grid.cols);

            var tile = document.createElement('div');
            tile.className = 'phone-tile';
            tile.dataset.row = row;
            tile.dataset.col = col;
            tile.dataset.rowCount = inThisRow;
            tile.dataset.storyIndex = index;
            tile.dataset.jitterX = (Math.random() * 2 - 1).toFixed(4);
            tile.dataset.jitterY = (Math.random() * 2 - 1).toFixed(4);
            tile.dataset.tilt = ((Math.random() - 0.5) * config.tilt).toFixed(2);
            tile.setAttribute('role', 'button');
            tile.tabIndex = 0;
            tile.setAttribute('aria-label', 'Play story: ' + (story.title || 'untitled'));

            var poster = document.createElement('img');
            poster.src = story.poster;
            poster.alt = '';
            poster.decoding = 'async';

            if (story.posterWebp) {
                // <picture> lets the browser pick the WebP and never download
                // the GIF at all; browsers without WebP still get the GIF.
                var picture = document.createElement('picture');
                var source = document.createElement('source');
                source.type = 'image/webp';
                source.srcset = story.posterWebp;
                picture.appendChild(source);
                picture.appendChild(poster);
                tile.appendChild(picture);
            } else {
                tile.appendChild(poster);
            }

            stage.appendChild(tile);
            tiles.push(tile);
        }

        placeTiles();
    }

    /* ------------------------------------------------------------------ *
     * Playback
     * ------------------------------------------------------------------ */

    function clearTimers() {
        if (watchdog) { clearTimeout(watchdog); watchdog = null; }
        if (openTimer) { clearTimeout(openTimer); openTimer = null; }
    }

    function armWatchdog(ms) {
        if (watchdog) clearTimeout(watchdog);
        watchdog = setTimeout(function () {
            console.warn('Playback watchdog fired after ' + ms + 'ms; recovering.');
            closeStory();
        }, ms);
    }

    // Works out the transform that would make the full-size player frame sit
    // exactly on top of a given tile. Measures the frame with its transform
    // cleared, so this stays correct even if called mid-animation.
    function flipFrom(tile) {
        var prevTransition = frame.style.transition;
        var prevTransform = frame.style.transform;
        frame.style.transition = 'none';
        frame.style.transform = 'none';
        var frameRect = frame.getBoundingClientRect();
        frame.style.transform = prevTransform;
        frame.style.transition = prevTransition;

        var tileRect = tile.getBoundingClientRect();
        if (!frameRect.width) return null;

        var scale = tile.offsetWidth / frameRect.width;
        var dx = (tileRect.left + tileRect.width / 2) - (frameRect.left + frameRect.width / 2);
        var dy = (tileRect.top + tileRect.height / 2) - (frameRect.top + frameRect.height / 2);
        return { scale: scale, dx: dx, dy: dy, tilt: tile.dataset.tilt };
    }

    function applyFlip(f) {
        frame.style.transform =
            'translate(' + f.dx + 'px,' + f.dy + 'px) scale(' + f.scale + ') rotate(' + f.tilt + 'deg)';
    }

    async function openStory(tile) {
        if (isBusy) return;
        var story = stories[Number(tile.dataset.storyIndex)];
        if (!story || !story.video) return;   // belt and braces; filtered at load

        isBusy = true;
        var mySession = ++session;
        activeTile = tile;
        tile.classList.add('is-source');
        notifyCache('pause');

        caption.textContent = story.title || '';
        overlay.classList.add('is-open');
        closeButton.hidden = false;

        var flip = flipFrom(tile);
        if (flip) {
            frame.style.transition = 'none';
            applyFlip(flip);
            // Force a reflow so the browser treats the next change as a transition.
            void frame.offsetWidth;
            frame.style.transition = 'transform var(--open-ms) var(--ease)';
        }
        frame.style.transform = 'translate(0,0) scale(1) rotate(0deg)';

        ambience.pause();

        player.src = story.video;
        player.muted = false;
        player.loop = false;
        player.load();

        armWatchdog(LOAD_TIMEOUT_MS);

        // Start when the media is actually ready, not on a blind timer. Kicking
        // play() before anything is buffered is what produces the stutter in the
        // first second or two of a story. The animation delay is a floor, the
        // watchdog is the ceiling, and whichever readiness signal arrives first
        // wins.
        var started = false;
        var animationDone = false;
        var mediaReady = player.readyState >= 3;   // HAVE_FUTURE_DATA

        function beginPlayback() {
            if (started || mySession !== session) return;
            if (!animationDone || !mediaReady) return;
            started = true;
            player.removeEventListener('canplay', onReady);
            player.removeEventListener('canplaythrough', onReady);
            overlay.classList.remove('is-buffering');

            // play() rejects on autoplay refusal, a decode failure or a torn-down
            // element. A genuine failure must funnel into the same recovery path,
            // otherwise the wall sits frozen waiting for an 'ended' that never comes.
            var attempt = player.play();
            if (attempt && typeof attempt.catch === 'function') {
                attempt.catch(function (err) {
                    // The story was already closed or replaced while play() was
                    // still pending. Acting now would tear down whatever is on
                    // screen instead, so let the stale rejection go.
                    if (mySession !== session) return;
                    if (err && err.name === 'AbortError') return;
                    console.error('Playback failed:', err);
                    closeStory();
                });
            }
        }

        function onReady() {
            mediaReady = true;
            beginPlayback();
        }

        player.addEventListener('canplay', onReady);
        player.addEventListener('canplaythrough', onReady);

        openTimer = setTimeout(function () {
            openTimer = null;
            if (mySession !== session) return;
            animationDone = true;
            if (!mediaReady) overlay.classList.add('is-buffering');
            beginPlayback();
        }, 550 + config.openDelayMs);
    }

    // Idempotent: safe to call from 'ended', 'error', the watchdog, Escape,
    // the backdrop and the close button, however many times they overlap.
    function closeStory() {
        if (!isBusy) return;
        isBusy = false;
        session++;
        clearTimers();

        player.pause();
        overlay.classList.remove('is-buffering');
        // Detaching the source is what actually frees the decoded video buffer.
        // Without this the kiosk accumulates one buffer per story played.
        player.removeAttribute('src');
        player.load();

        var tile = activeTile;
        activeTile = null;

        var flip = tile ? flipFrom(tile) : null;
        overlay.classList.remove('is-open');
        closeButton.hidden = true;
        if (flip) {
            frame.style.transition = 'transform var(--open-ms) var(--ease)';
            applyFlip(flip);
        }

        window.setTimeout(function () {
            if (tile) tile.classList.remove('is-source');
            // Only reset the frame if nothing else has started in the meantime.
            if (!isBusy) {
                frame.style.transition = 'none';
                frame.style.transform = 'none';
            }
        }, 550);

        var resume = ambience.play();
        if (resume && typeof resume.catch === 'function') resume.catch(function () {});
        notifyCache('resume');
    }

    player.addEventListener('ended', closeStory);
    player.addEventListener('error', function () {
        // Detaching the src on close also raises an error event, and it arrives
        // asynchronously — often after the next story has already opened and
        // attached its own src. Acting on it would tear down the new story
        // instead of the old one, leaving a tile that simply does nothing when
        // tapped.
        //
        // player.error is what separates the two cases: a genuine failure sets a
        // MediaError before the event is dispatched, whereas the new story's
        // load() clears it back to null, so a stale teardown event always
        // arrives with nothing attached.
        if (!isBusy) return;
        if (!player.error) return;
        console.error('Video error', player.error && player.error.code,
                      player.error && player.error.message, player.currentSrc);
        closeStory();
    });
    player.addEventListener('loadedmetadata', function () {
        // Re-arm using the real duration now that we know it.
        if (!isBusy) return;
        if (isFinite(player.duration) && player.duration > 0) {
            armWatchdog(player.duration * 1000 + OVERRUN_GRACE_MS);
        }
    });

    // A stall must not cost the visitor the end of the story. The watchdog is
    // re-armed against the time *remaining*, so buffering delays extend the
    // deadline instead of cutting the testimony off part-way through.
    player.addEventListener('timeupdate', function () {
        if (!isBusy || !isFinite(player.duration) || player.duration <= 0) return;
        var remaining = (player.duration - player.currentTime) * 1000;
        armWatchdog(Math.max(remaining, 1000) + OVERRUN_GRACE_MS);
    });

    // Tell the visitor the wall is working rather than broken.
    player.addEventListener('waiting', function () {
        if (isBusy) overlay.classList.add('is-buffering');
    });
    player.addEventListener('playing', function () {
        overlay.classList.remove('is-buffering');
    });

    closeButton.addEventListener('click', closeStory);
    overlay.addEventListener('click', function (event) {
        if (event.target === overlay) closeStory();
    });
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeStory();
    });

    stage.addEventListener('click', function (event) {
        var tile = event.target.closest('.phone-tile');
        if (tile) openStory(tile);
    });
    stage.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        var tile = event.target.closest('.phone-tile');
        if (tile) { event.preventDefault(); openStory(tile); }
    });

    var resizeTimer = null;
    window.addEventListener('resize', function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(placeTiles, 150);
    });

    /* ------------------------------------------------------------------ *
     * Folder-picker fallback (Chromium only)
     * ------------------------------------------------------------------ */

    function stemOf(name) {
        var dot = name.lastIndexOf('.');
        return dot > 0 ? name.slice(0, dot) : name;
    }

    async function loadFromFolder() {
        var handle = await window.showDirectoryPicker();
        var posters = new Map();
        var videos = new Map();

        for await (var entry of handle.values()) {
            if (entry.kind !== 'file') continue;
            var file = await entry.getFile();
            var ext = file.name.slice(file.name.lastIndexOf('.') + 1).toLowerCase();
            if (ext === 'gif') posters.set(stemOf(file.name), file);
            else if (ext === 'mp4') videos.set(stemOf(file.name), file);
        }

        var picked = [];
        posters.forEach(function (posterFile, stem) {
            var videoFile = videos.get(stem);
            if (!videoFile) return;   // unpaired poster: skip rather than crash later
            var posterUrl = URL.createObjectURL(posterFile);
            var videoUrl = URL.createObjectURL(videoFile);
            objectUrls.push(posterUrl, videoUrl);
            picked.push({ id: stem, title: stem, poster: posterUrl, video: videoUrl });
        });

        if (picked.length === 0) {
            throw new Error('That folder has no matching .gif / .mp4 pairs.');
        }
        return picked;
    }

    window.addEventListener('pagehide', function () {
        objectUrls.forEach(URL.revokeObjectURL);
        objectUrls = [];
    });

    /* ------------------------------------------------------------------ *
     * Boot
     * ------------------------------------------------------------------ */

    function start() {
        startScreen.hidden = true;
        errorScreen.hidden = true;
        buildWall();
        var play = ambience.play();
        if (play && typeof play.catch === 'function') play.catch(function () {});

        // Pull a few stories into the local cache while nobody is watching, so
        // the first tap plays instantly instead of buffering. This waits until
        // the tile animations have finished arriving — starting earlier just
        // makes the wall itself load slowly, which is the first thing anyone
        // sees.
        whenTilesLoaded().then(function () {
            setTimeout(warmCache, 3000);
        });
    }

    // Resolves once every tile image has loaded or failed. Capped, so a single
    // missing GIF can never keep the cache cold forever.
    function whenTilesLoaded() {
        var images = tiles.map(function (tile) {
            return tile.querySelector('img');
        }).filter(Boolean);
        var pending = images.filter(function (img) { return !img.complete; });
        if (!pending.length) return Promise.resolve();

        return new Promise(function (resolve) {
            var left = pending.length;
            var done = false;
            function tick() {
                if (done) return;
                left -= 1;
                if (left <= 0) { done = true; resolve(); }
            }
            pending.forEach(function (img) {
                img.addEventListener('load', tick, { once: true });
                img.addEventListener('error', tick, { once: true });
            });
            setTimeout(function () {
                if (!done) { done = true; resolve(); }
            }, 30000);
        });
    }

    async function boot() {
        initMediaCache();
        try {
            stories = await loadManifest();
            startButton.disabled = false;
            // A retry that succeeds should not leave the fallback offered.
            pickerButton.hidden = true;
        } catch (err) {
            console.error(err);
            if (location.protocol === 'file:') {
                showError(
                    'This page has to be served over http, not opened straight from the file system. ' +
                    'Run start.cmd (Windows) or ./start.sh (macOS/Linux) from the project folder, ' +
                    'then open http://localhost:8000.',
                    String(err.message || err)
                );
            } else {
                showError(
                    'stories.json could not be read. Run tools/serve.py to regenerate it, and check ' +
                    'that the media in final_gifs/ has been fetched with "git lfs pull".',
                    String(err.message || err)
                );
            }
            // The picker is still a way in if the manifest is broken.
            if ('showDirectoryPicker' in window) pickerButton.hidden = false;
        }
    }

    startButton.addEventListener('click', function () {
        if (stories.length) start();
    });

    retryButton.addEventListener('click', function () {
        errorScreen.hidden = true;
        startScreen.hidden = false;
        boot();
    });

    pickerButton.addEventListener('click', async function () {
        try {
            stories = await loadFromFolder();
            start();
        } catch (err) {
            if (err && err.name === 'AbortError') return;   // user dismissed the dialog
            showError('Could not read that folder.', String(err.message || err));
        }
    });

    boot();
})();
</script>
</body>
</html>
